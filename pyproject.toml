[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "ndscape"
dynamic = ["version"]
description = "Nested dichotomies in Python: fit, score and map nested dichotomy trees for multiclass classification."
readme = "ndscape/README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    {name = "Maxwell Dix-Matthews"},
]
keywords = ["nested-dichotomy", "nested dichotomies", "multiclass", "multiclass classification", "hierarchical classification", "tree embedding", "classification", "scikit-learn"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "joblib>=1.2",
]

[project.optional-dependencies]
spatial = ["esda>=2.6", "libpysal>=4.10"]
plot = ["matplotlib>=3.5", "bokeh>=3.0"]

[project.urls]
Homepage = "https://github.com/res-lucid/ndscape"
Repository = "https://github.com/res-lucid/ndscape"
Paper = "https://arxiv.org/abs/2610.18050"
Issues ="https://github.com/res-lucid/ndscape/issues"
"Interactive maps" = "https://res-lucid.github.io/ndscape-plots/"
"Data archive" = "https://doi.org/10.5281/zenodo.20456943"

[tool.setuptools_scm]

[tool.setuptools.packages.find]
include = ["ndscape*"]
